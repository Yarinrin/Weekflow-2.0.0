name: Build Android APK

# The APK is built here rather than locally because a CI runner has the Android SDK
# and unrestricted access to Google's Maven repository. Every push to a development
# branch produces a downloadable debug APK under the run's Artifacts.

on:
  push:
    branches: ['main', 'claude/**']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Also build an unsigned release APK'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A Gradle step that blocks on a prompt would otherwise sit here for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build web bundle
        run: npm run build

      # Contrast and touch-target checks against the real rendered app in both themes,
      # so an accessibility regression fails the build instead of shipping.
      - name: Accessibility audit
        run: |
          npx vite preview --port 4173 --host 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          npm run a11y

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Install the exact packages AGP 8.2.1 / compileSdk 34 needs, and accept the
      # licences up front. Left to itself Gradle downloads missing components mid-build
      # and blocks on a licence prompt that has no terminal to answer it.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Accept SDK licences
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace --console=plain
        env:
          # Fail rather than pause if anything is still missing.
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false

      - name: Build release APK (unsigned)
        if: inputs.release
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: weekflow-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        if: inputs.release
        uses: actions/upload-artifact@v4
        with:
          name: weekflow-release-apk-unsigned
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
